name = "upmagic"
compatibility_date = "2024-05-01"

# Use a Worker + site configuration so Wrangler deploys both the Worker and static files
main = "worker/index.js"

[site]
bucket = "./frontend"
include = ["**/*"]
exclude = ["**/.git/*"]

[vars]
# GITHUB_GIST_ID = "" (Set via secrets or vars later)
# ISSUES_PAT = "" (Set via secrets)
# NOTIFY_WEBHOOK_URL = "" (Set via secrets)

[[kv_namespaces]]
binding = "STATUS_KV"
id = "d6179b2f901645de81b9805c4e7ac591"
preview_id = "59e7164e44154d7fa79b2a093b338530"

[triggers]
crons = ["*/5 * * * *"] # Run every 5 minutes for heartbeat